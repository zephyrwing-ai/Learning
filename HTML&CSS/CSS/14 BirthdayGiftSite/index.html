<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="header">
            <h1>Today is Zephyr's birthday 🎉</h1>
            <img src="./images/zephyr.jpeg" class="circle-image">
            <h2 id="bage">22 years old</h2>
            <h4 id="bdate">31.12.2026</h4>
        </div>

        <div class="gift-section">
            <h2 class="happy-text">Here is how happy I am for you today 🥳</h2>
            <h3 class="hover-text">Hover over the gift</h3>
            <div class="gift-img" id="gift1" role="img" aria-label="A wrapped present. When hovered over, it changes to reveal a GIF of two friends cheering and jumping."></div>
        </div>

        <div class="gift-section">
            <h2 class="happy-text">How people react when you enter the room 😍</h2>
            <div class="gift-img" id="gift2" role="img" aria-label="A wrapped present. It changes to reveal a person smiling and winking on hover."></div>
        </div>
        
        <div class="gift-section">
            <h2 class="happy-text">If I had to describe you with ONE word 👇</h2>
            <div class="gift-img" id="gift3" role="img" aria-label="A wrapped present. It changes to reveal a person with a clever, confident expression on hover."></div>
        </div>

        <div class="gift-section">
            <h2 class="happy-text">The only person as badass as you 💪</h2>
            <div class="gift-img" id="gift4" role="img" aria-label="A wrapped present. It changes to reveal a confident, tough-looking person on hover."></div>
        </div>

        <div class="gift-section">
            <h2 class="happy-text">This one's for you, my friend 🥂</h2>
            <div class="gift-img" id="gift5" role="img" aria-label="A wrapped present. It changes to reveal friends celebrating and toasting on hover."></div>
        </div>
    </body>
</html>
